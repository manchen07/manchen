project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - contact.qmd
    - cv.qmd
    - publications/index.qmd
    - teaching/index.qmd
    - software/index.qmd
  resources:
    - .nojekyll

website:
  title: "Man Chen"
  site-url: https://manchen07.github.io/manchen/
  repo-url: https://github.com/manchen07/manchen
  navbar:
    background: light
    left:
      - text: CV
        href: /files/Chen-CV-Github.pdf
      - href: index.qmd
        text: Home
      - href: publications/index.qmd
        text: Research
      - href: teaching/index.qmd
        text: Teaching
      - href: software/index.qmd
